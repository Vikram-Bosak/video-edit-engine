name: AI Video Edit Engine

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to process'
        required: false
        type: string
      platform:
        description: 'Target platform'
        required: true
        default: 'tiktok'
        type: choice
        options:
          - tiktok
          - youtube_short
          - facebook_reel
          - instagram_reel
          - twitter_video
      quality:
        description: 'Quality preset'
        required: false
        default: 'high'
        type: choice
        options:
          - low
          - medium
          - high
          - ultra

  push:
    branches: [main]
    paths:
      - 'assets/videos/**'

  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.11'
  PLATFORM: ${{ github.event.inputs.platform || 'tiktok' }}

jobs:
  process:
    name: Process Videos
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            libass-dev \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installations
        run: |
          ffmpeg -version | head -1
          python -c "import cv2; print(f'OpenCV {cv2.__version__}')"
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          python -c "from PIL import Image; print('Pillow OK')"
          echo "All dependencies verified"

      - name: Recreate credentials files from secrets
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if [ -n "$GOOGLE_DRIVE_CREDENTIALS" ]; then
            echo "$GOOGLE_DRIVE_CREDENTIALS" > credentials.json
          fi
          if [ -n "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "$GOOGLE_DRIVE_TOKEN" > token.json
          fi

      - name: Run Multi-Agent Automated Workflow Agent
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Fetch next topic from google sheet / local tracker queue and process it
          # For automation default runs, we execute the main compiler.
          python python/workflow_agent.py --topic "Baseball Funny Fails" --upload --folder-id "1ZA6V3HpKy4yIdZ-8ns8pTvNNwU5zVrcS"

      - name: Upload video outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edited-videos-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -f credentials.json token.json
          echo "Cleanup complete"
