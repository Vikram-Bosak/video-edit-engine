name: AI Video Edit Engine

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to create ranking video (e.g. "high jump fails", "funny basketball")'
        required: true
        type: string
      video_url:
        description: 'Specific video URL (optional - skip topic search)'
        required: false
        type: string
      num_clips:
        description: 'Number of clips (6 for 6→1 countdown)'
        required: false
        default: '6'
        type: choice
        options:
          - '5'
          - '6'
          - '8'
      platform:
        description: 'Target platform'
        required: true
        default: 'youtube_short'
        type: choice
        options:
          - tiktok
          - youtube_short
          - facebook_reel
          - instagram_reel
          - twitter_video
      quality:
        description: 'Quality preset'
        required: false
        default: 'high'
        type: choice
        options:
          - low
          - medium
          - high
          - ultra
      enable_voiceover:
        description: 'Add AI voiceover narration'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      enable_character_overlay:
        description: 'Add fox character overlay'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      use_template:
        description: 'Use editing template'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - cinematic
          - fast_paced

  push:
    branches: [master, main]
    paths:
      - 'assets/videos/**'
      - '.github/workflows/video-edit.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: '3.11'
  PLATFORM: ${{ github.event.inputs.platform || 'youtube_short' }}
  QUALITY: ${{ github.event.inputs.quality || 'high' }}
  TOPIC: ${{ github.event.inputs.topic || 'funny fails compilation' }}
  NUM_CLIPS: ${{ github.event.inputs.num_clips || '6' }}
  ENABLE_VOICEOVER: ${{ github.event.inputs.enable_voiceover || 'true' }}
  ENABLE_OVERLAY: ${{ github.event.inputs.enable_character_overlay || 'true' }}
  INPUT_DIR: assets/videos
  OUTPUT_DIR: output
  REPORT_DIR: reports

jobs:
  ranking-compilation:
    name: Ranking Compilation (${{ env.TOPIC }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            libass-dev \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-freefont-ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp gTTS feedparser google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client --quiet

      - name: Verify installations
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          yt-dlp --version
          python -c "import cv2; print(f'OpenCV {cv2.__version__}')"
          python -c "import numpy; print(f'NumPy {numpy.__version__}')"
          echo "All dependencies verified"

      - name: Run ranking compilation workflow
        id: ranking
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }} ${{ env.REPORT_DIR }} ${{ env.INPUT_DIR }}
          python -m python.ranking_compilation_workflow \
            --query "${{ env.TOPIC }}" \
            --output "${{ env.OUTPUT_DIR }}/ranking_compilation.mp4" \
            --clips ${{ env.NUM_CLIPS }} \
            --json-result "${{ env.REPORT_DIR }}/workflow_result.json" \
            $( [ "${{ env.ENABLE_VOICEOVER }}" = "false" ] && echo "--no-voiceover" ) \
            $( [ "${{ env.ENABLE_OVERLAY }}" = "false" ] && echo "--no-overlay" )

      - name: Display workflow result
        if: always()
        run: |
          if [ -f "${{ env.REPORT_DIR }}/workflow_result.json" ]; then
            cat "${{ env.REPORT_DIR }}/workflow_result.json"
          fi

      - name: Upload video outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ranking-videos-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_number }}
          path: ${{ env.REPORT_DIR }}/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          rm -rf temp/
          echo "Cleanup complete"
