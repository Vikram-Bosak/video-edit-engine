name: Aura shours Video eddit agents

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic for compilation (Set custom name or default to SHEET queue)'
        required: true
        default: 'SHEET'
        type: string

  push:
    branches: [master, main]
    paths:
      - 'assets/videos/**'
      - '.github/workflows/video-edit.yml'

  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write
  actions: write

env:
  PYTHON_VERSION: '3.11'
  OUTPUT_DIR: output

jobs:
  ranking-compilation:
    name: Ranking Compilation (Hourly Automated Multi-Agent)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            imagemagick \
            libass-dev \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto \
            fonts-noto-color-emoji \
            fonts-freefont-ttf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yt-dlp gTTS feedparser google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client opencv-python numpy Pillow --quiet

      - name: Verify installations
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
          yt-dlp --version
          python -c "import cv2; print(f'OpenCV {cv2.__version__}')"

      - name: Recreate credentials files from secrets
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_JSON }}
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$GOOGLE_DRIVE_CREDENTIALS" ]; then
            echo "$GOOGLE_DRIVE_CREDENTIALS" > credentials.json
          fi
          if [ -n "$GOOGLE_DRIVE_TOKEN" ]; then
            echo "$GOOGLE_DRIVE_TOKEN" > token.json
          fi
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > cookies.txt
          fi

      - name: Run Multi-Agent Automated Workflow Agent
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python python/workflow_agent.py --topic "${{ github.event.inputs.topic || 'SHEET' }}" --upload --folder-id "1ZA6V3HpKy4yIdZ-8ns8pTvNNwU5zVrcS"

      - name: Upload video outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edited-videos-${{ github.run_number }}
          path: ${{ env.OUTPUT_DIR }}/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -f credentials.json token.json cookies.txt
          echo "Cleanup complete"
