version: "1.0.0"
default_platform: tiktok
temp_dir: temp
output_dir: output

platforms:
  tiktok:
    width: 1080
    height: 1920
    fps: 30
    max_duration: 180
    codec: libx264
    bitrate: 8M
    audio_codec: aac
    audio_bitrate: 128k
    crf: 18
    preset: fast
  youtube_short:
    width: 1080
    height: 1920
    fps: 30
    max_duration: 60
    codec: libx264
    bitrate: 10M
    audio_codec: aac
    audio_bitrate: 128k
    crf: 18
    preset: fast
  facebook_reel:
    width: 1080
    height: 1920
    fps: 30
    max_duration: 90
    codec: libx264
    bitrate: 8M
    audio_codec: aac
    audio_bitrate: 128k
    crf: 18
    preset: fast
  instagram_reel:
    width: 1080
    height: 1920
    fps: 30
    max_duration: 90
    codec: libx264
    bitrate: 8M
    audio_codec: aac
    audio_bitrate: 128k
    crf: 18
    preset: fast
  twitter_video:
    width: 1280
    height: 720
    fps: 30
    max_duration: 140
    codec: libx264
    bitrate: 5M
    audio_codec: aac
    audio_bitrate: 128k
    crf: 20
    preset: fast

scene_detection:
  threshold: 30.0
  min_scene_duration: 0.5
  max_scenes: 50

smart_crop:
  target_aspect: "9:16"
  strategy: smart
  face_weight: 5.0
  human_weight: 3.0

transitions:
  default_type: fade
  default_duration: 0.5

text:
  default_font: Arial
  title_size: 80
  subtitle_size: 48
  title_color: "#FFFFFF"
  stroke_color: "#000000"
  stroke_width: 3

audio:
  music_volume: 0.3
  normalize_lufs: -14.0
  enable_ducking: true
  duck_amount: 0.6

subtitles:
  enabled: true
  font: Arial
  font_size: 42
  word_highlight: true
  format: ass

color_grading:
  preset: cinematic
  brightness: 0.0
  contrast: 1.0
  saturation: 1.1

motion_effects:
  enable_ken_burns: true
  enable_zoom: true
  zoom_intensity: 0.15

export:
  codec: libx264
  preset: fast
  crf: 18
  pixel_format: yuv420p
  faststart: true

batch:
  max_workers: 2
  retry_count: 2
  timeout_seconds: 3600
